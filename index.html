<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>欣錦 AI 鍛力系統導入檢核表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#F0F1F3;
    --surface-card:#FFFFFF;
    --surface-card-alt:#EAF0F5;
    --header-bg:#E7E9EC;
    --text-primary:#16181D;
    --text-secondary:#5B616B;
    --text-muted:#8F8C82;
    --accent:#2E5C8A;
    --border:#DCDFE3;
    --status-ok:#D6DCE1;
    --status-warn:#8AA6BE;
    --status-error:#C0392B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'IBM Plex Sans TC','Inter',sans-serif;
    background:#DEE0E3;
    display:flex; justify-content:center; padding:32px 16px;
  }

  /* ==================== 版面框架 ==================== */
  .frame{
    width:100%; max-width:1100px; min-height:600px;
    background:var(--bg-page);
    border-radius:20px; border:1px solid #C9C6BD;
    padding:28px 32px; box-sizing:border-box;
    display:flex; flex-direction:column;
  }
  .header{ font-size:20px; font-weight:700; color:var(--text-primary); margin-bottom:18px; }

  /* ==================== 表單欄位 ==================== */
  .form-row{ display:flex; gap:16px; margin-bottom:22px; }
  .form-field{ flex:1; }
  .form-label{ font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; display:block; }
  .form-input{
    width:100%; height:44px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface-card); padding:0 14px; font-size:14px; color:var(--text-primary);
    font-family:inherit; box-sizing:border-box;
  }
  .form-input:focus{ outline:none; border-color:var(--accent); }
  select.form-input{ cursor:pointer; appearance:auto; }
  .form-input.error{ border-color:var(--status-error); }
  .field-error{ display:none; font-size:12px; color:var(--status-error); margin-top:4px; }
  .field-error.visible{ display:block; }

  /* ==================== 送出失敗彈窗 ==================== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(22,24,29,0.45);
    display:none; align-items:center; justify-content:center; z-index:1000; padding:20px;
  }
  .modal-overlay.visible{ display:flex; }
  .modal-card{
    position:relative; background:#FFFFFF; border-radius:16px; padding:28px 26px; max-width:340px; width:100%;
    text-align:center; box-shadow:0 8px 24px rgba(22,24,29,0.25);
  }
  .modal-close{
    position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
    border:none; background:transparent; color:var(--text-secondary); font-size:16px;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-family:inherit; transition:background 0.15s;
  }
  .modal-close:hover{ background:var(--header-bg); }
  .modal-icon{
    width:52px; height:52px; border-radius:50%; background:var(--status-error); color:#FFFFFF;
    font-size:24px; font-weight:700; display:flex; align-items:center; justify-content:center;
    margin:0 auto 14px;
  }
  .modal-title{ font-size:16px; font-weight:700; color:var(--text-primary); margin-bottom:8px; }
  .modal-message{ font-size:13px; color:var(--text-secondary); line-height:1.6; margin-bottom:22px; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions .clear-btn, .modal-actions .submit-btn{ flex:1; height:44px; padding:0; }

  /* ==================== 按鈕 / 動作列 ==================== */
  .action-row{ display:flex; gap:12px; margin-top:20px; justify-content:flex-end; align-items:center; }
  .submit-status{ font-size:13px; color:var(--text-muted); margin-right:auto; }
  .submit-btn{
    height:48px; padding:0 32px; border-radius:12px;
    background:var(--accent); color:#FFFFFF; font-size:15px; font-weight:700;
    border:none; cursor:pointer; font-family:inherit;
    box-shadow:0 2px 4px rgba(22,24,29,0.14), 0 4px 10px rgba(22,24,29,0.08);
    transition:opacity 0.15s;
  }
  .submit-btn:active{ opacity:0.8; }
  .submit-btn:disabled{ opacity:0.5; cursor:default; }
  .clear-btn{
    height:48px; padding:0 28px; border-radius:12px;
    background:transparent; color:var(--accent); font-size:15px; font-weight:700;
    border:1.5px solid var(--accent); cursor:pointer; font-family:inherit;
    transition:opacity 0.15s;
  }
  .clear-btn:active{ opacity:0.7; }

  /* ==================== 測試項目卡片 ==================== */
  .c-detail{
    flex:1; min-height:460px; background:var(--surface-card); border-radius:12px; padding:16px 18px;
    box-shadow:0 2px 4px rgba(22,24,29,0.14), 0 4px 10px rgba(22,24,29,0.08);
  }
  .c-detail-title{ font-size:15px; font-weight:700; color:var(--accent); margin-bottom:10px; }
  .item-tabs{ display:flex; gap:7px; margin:6px 0 10px; }
  .item-tab{ padding:7px 15px; border-radius:12px; background:var(--header-bg); font-size:13px; color:var(--text-secondary); cursor:pointer; user-select:none; }
  .item-tab.active{ background:var(--accent); color:#FFFFFF; font-weight:600; }
  .b-step-label{ font-size:14px; font-weight:600; color:var(--text-primary); margin:12px 0 6px; min-height:1px; }
  .b-step-group{ margin-bottom:10px; padding-left:10px; border-left:2px solid var(--border); }
  .b-step-title{ font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .b-item{ display:flex; align-items:center; gap:10px; padding:8px 0; font-size:14px; color:var(--text-secondary); cursor:pointer; user-select:none; }
  .b-check{ width:19px; height:19px; border:1.5px solid #B9BEC4; border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:opacity 0.15s; }
  .b-check.done{ background:var(--accent); border-color:var(--accent); }
  .b-check.done::after{ content:'✓'; color:#FFFFFF; font-size:13px; font-weight:700; line-height:1; }
  .b-item:active .b-check{ opacity:0.7; }
  .c-log{ margin-top:12px; font-size:11px; color:var(--text-muted); }

  /* ==================== 完成頁 ==================== */
  .completion-view{
    display:none; flex-direction:column; align-items:center; text-align:center;
    gap:14px; padding:64px 20px; flex:1;
  }
  .completion-view.visible{ display:flex; }
  .completion-icon{
    width:60px; height:60px; border-radius:50%; background:var(--accent); color:#FFFFFF;
    font-size:28px; font-weight:700; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 4px rgba(22,24,29,0.14), 0 4px 10px rgba(22,24,29,0.08);
  }
  .completion-title{ font-size:18px; font-weight:700; color:var(--text-primary); }
  .completion-summary{ font-size:13px; color:var(--text-secondary); line-height:1.7; text-align:left; }
  .completion-summary b{ color:var(--text-primary); font-weight:600; }

  /* ==================== RWD ==================== */
  @media (max-width:900px){
    .frame{ padding:22px 20px; }
  }
  @media (max-width:720px){
    .form-row{ flex-direction:column; gap:14px; }
  }
  @media (max-width:480px){
    body{ padding:16px 10px; }
    .frame{ padding:18px 14px; border-radius:16px; }
    .header{ font-size:18px; }
    .action-row{ flex-direction:column-reverse; align-items:stretch; }
    .submit-status{ margin-right:0; margin-bottom:8px; text-align:center; }
    .submit-btn, .clear-btn{ width:100%; }
  }
</style>
</head>
<body>

<!-- 送出失敗彈窗 -->
<div class="modal-overlay" id="errorModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeErrorModal()" aria-label="關閉">✕</button>
    <div class="modal-icon">!</div>
    <div class="modal-title">送出失敗</div>
    <div class="modal-message" id="errorModalMessage"></div>
    <div class="modal-actions">
      <button class="clear-btn" onclick="closeErrorModal()">返回</button>
      <button class="submit-btn" onclick="retrySubmit()">重新送出</button>
    </div>
  </div>
</div>

<div class="frame">
  <div class="header">欣錦 AI 鍛力系統導入檢核表</div>

  <!-- 表單畫面 -->
  <div id="formView">
    <div class="form-row">
      <div class="form-field">
        <label class="form-label" for="siteContact">廠區聯絡人</label>
        <input class="form-input" type="text" id="siteContact" placeholder="請輸入廠區聯絡人姓名">
        <div class="field-error" id="siteContactError"></div>
      </div>
      <div class="form-field">
        <label class="form-label" for="companyName">公司/工廠名稱</label>
        <input class="form-input" type="text" id="companyName" placeholder="請輸入公司/工廠名稱">
        <div class="field-error" id="companyNameError"></div>
      </div>
      <div class="form-field">
        <label class="form-label" for="checkerName">檢核表填寫人</label>
        <input class="form-input" type="text" id="checkerName" placeholder="請輸入填寫人姓名">
        <div class="field-error" id="checkerNameError"></div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label class="form-label" for="machineName">機台型號</label>
        <input class="form-input" type="text" id="machineName" placeholder="請輸入機台型號">
        <div class="field-error" id="machineNameError"></div>
      </div>
      <div class="form-field">
        <label class="form-label" for="systemModel">系統型號</label>
        <input class="form-input" type="text" id="systemModel" placeholder="請輸入系統型號">
        <div class="field-error" id="systemModelError"></div>
      </div>
      <div class="form-field">
        <label class="form-label" for="useTarget">使用目標</label>
        <select class="form-input" id="useTarget" onchange="selectPhase(this.value)"></select>
        <div class="field-error" id="useTargetError"></div>
      </div>
    </div>

    <div class="c-detail" id="detail"></div>

    <div class="action-row">
      <span class="submit-status" id="submitStatus"></span>
      <button class="clear-btn" onclick="handleClear()">清除</button>
      <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">送出</button>
    </div>
  </div>

  <!-- 送出完成頁 -->
  <div id="completionView" class="completion-view">
    <div class="completion-icon">✓</div>
    <div class="completion-title">檢核表已送出</div>
    <div class="completion-summary" id="completionSummary"></div>
    <button class="submit-btn" onclick="startNextChecklist()">開啟下一張檢核表</button>
  </div>
</div>

<script>
/* ============================================================
 * 設定：Google Sheet 串接網址
 * ============================================================ */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8bCbwDRI-JB2h6DOuoqxm4-fjlk92wnSY9zUnPactRu0Rue3go8NWCB8iC5yaMg0ABw/exec';

/* ============================================================
 * 資料模型
 * 使用目標（tier1）-> 測試項目（tier2）-> step1/step2 勾選項（tier3）
 * 入料分段／打頭：保留項目層級的資料結構，但項目名稱留空（不顯示），
 * 只顯示 step1/step2 與勾選項，使用跟搓牙/品管共用的同一組文字。
 * ============================================================ */
var phases = {
  '入料分段': { items:[''] },
  '打頭':     { items:[''] },
  '搓牙':     { items:['牙板壓力測試','波形偵測'] },
  '品管':     { items:['螺絲品質偵測'] }
};
var order = ['入料分段','打頭','搓牙','品管'];
var step1Items = ['現場機台警示燈','系統介面顯示','現場機台停機'];
var step2Items = ['快速發現異常警示','可排除錯誤','機台警示與系統介面顯示恢復正常值'];

/* 必填欄位設定：id、對應的錯誤訊息容器 id、錯誤訊息文字 */
var REQUIRED_FIELDS = [
  { id:'siteContact',  errorId:'siteContactError',  message:'請填寫廠區聯絡人' },
  { id:'companyName',  errorId:'companyNameError',  message:'請填寫公司/工廠名稱' },
  { id:'checkerName',  errorId:'checkerNameError',  message:'請填寫檢核表填寫人' },
  { id:'machineName',  errorId:'machineNameError',  message:'請填寫機台型號' },
  { id:'systemModel',  errorId:'systemModelError',  message:'請填寫系統型號' },
  { id:'useTarget',    errorId:'useTargetError',    message:'請選擇使用目標' }
];

var selectedPhase = null;
var selectedItem = null;
var checkState = {}; // key: "phase|item" -> { step1:[bool,...], step2:[bool,...], updatedAt: Date|null }

function getState(phase, item){
  var key = phase + '|' + item;
  if (!checkState[key]){
    checkState[key] = {
      step1: step1Items.map(function(){ return false; }),
      step2: step2Items.map(function(){ return false; }),
      updatedAt: null
    };
  }
  return checkState[key];
}

/* ============================================================
 * 小工具
 * ============================================================ */
function val(id){
  return document.getElementById(id).value.trim();
}

function pad(n){
  return n < 10 ? '0' + n : '' + n;
}

function formatDateTime(d){
  return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
    ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/* ============================================================
 * 畫面渲染
 * ============================================================ */
function renderUseTargetOptions(){
  var sel = document.getElementById('useTarget');
  var placeholder = '<option value="" disabled ' + (selectedPhase ? '' : 'selected') + '>請選擇</option>';
  var options = order.map(function(name){
    return '<option value="' + name + '">' + name + '</option>';
  }).join('');
  sel.innerHTML = placeholder + options;
}

function checklistHtml(phase, item){
  var state = getState(phase, item);
  var h = '<div class="b-step-group"><div class="b-step-title">step1・可偵測並顯示異常值</div>';
  step1Items.forEach(function(t, i){
    var done = state.step1[i] ? 'done' : '';
    h += '<div class="b-item" onclick="toggleCheck(\'step1\',' + i + ')"><div class="b-check ' + done + '"></div>' + t + '</div>';
  });
  h += '</div><div class="b-step-group"><div class="b-step-title">step2・現場操作員執行</div>';
  step2Items.forEach(function(t, i){
    var done = state.step2[i] ? 'done' : '';
    h += '<div class="b-item" onclick="toggleCheck(\'step2\',' + i + ')"><div class="b-check ' + done + '"></div>' + t + '</div>';
  });
  h += '</div>';
  return h;
}

function renderDetail(){
  var detail = document.getElementById('detail');

  if (!selectedPhase){
    detail.innerHTML =
      '<div class="c-detail-title">測試項目</div>' +
      '<div class="b-step-title">請先選擇使用目標</div>';
    return;
  }

  var p = phases[selectedPhase];
  var state = getState(selectedPhase, selectedItem);
  var h = '<div class="c-detail-title">' + selectedPhase + '・測試項目</div>';
  if (p.items.length > 1){
    h += '<div class="item-tabs">';
    p.items.forEach(function(it){
      h += '<div class="item-tab ' + (it === selectedItem ? 'active' : '') + '" onclick="selectItem(\'' + it + '\')">' + it + '</div>';
    });
    h += '</div>';
  }
  h += '<div class="b-step-label">' + selectedItem + '</div>';
  h += checklistHtml(selectedPhase, selectedItem);
  h += '<div class="c-log">更新時間・' + (state.updatedAt ? formatDateTime(state.updatedAt) : '尚未填寫') + '</div>';
  detail.innerHTML = h;
}

function render(){
  document.getElementById('useTarget').value = selectedPhase || '';
  renderDetail();
}

/* ============================================================
 * 使用者互動：切換測試階段／項目／勾選
 * ============================================================ */
function selectPhase(name){
  selectedPhase = name;
  selectedItem = phases[name].items[0];
  render();
}

function selectItem(name){
  selectedItem = name;
  render();
}

function toggleCheck(stepKey, idx){
  var state = getState(selectedPhase, selectedItem);
  state[stepKey][idx] = !state[stepKey][idx];
  state.updatedAt = new Date(); // 記錄真實填入時間
  renderDetail();
}

/* ============================================================
 * 表單驗證
 * ============================================================ */
function setFieldError(inputId, errorId, message){
  document.getElementById(inputId).classList.add('error');
  var errEl = document.getElementById(errorId);
  errEl.textContent = message;
  errEl.classList.add('visible');
}

function clearFieldError(inputId, errorId){
  document.getElementById(inputId).classList.remove('error');
  var errEl = document.getElementById(errorId);
  errEl.textContent = '';
  errEl.classList.remove('visible');
}

function validateRequiredFields(){
  var isValid = true;
  REQUIRED_FIELDS.forEach(function(field){
    clearFieldError(field.id, field.errorId);
    if (!val(field.id)){
      setFieldError(field.id, field.errorId, field.message);
      isValid = false;
    }
  });
  return isValid;
}

/* ============================================================
 * 送出失敗彈窗
 * ============================================================ */
function showErrorModal(message){
  document.getElementById('errorModalMessage').textContent = message;
  document.getElementById('errorModal').classList.add('visible');
}

function closeErrorModal(){
  document.getElementById('errorModal').classList.remove('visible');
}

function retrySubmit(){
  closeErrorModal();
  handleSubmit();
}

/* ============================================================
 * 送出資料組裝：只組出「目前選擇的使用目標 × 測試項目」這一筆，
 * 勾選欄位直接用共用的 step1Items / step2Items 文字當 key。
 * ============================================================ */
function buildRecord(){
  var state = getState(selectedPhase, selectedItem);
  var rec = { '使用目標': selectedPhase, '測試項目': selectedItem || '' };
  step1Items.forEach(function(text, i){ rec[text] = state.step1[i] ? 'V' : ''; });
  step2Items.forEach(function(text, i){ rec[text] = state.step2[i] ? 'V' : ''; });
  return rec;
}

/* ============================================================
 * 送出流程
 * ============================================================ */
async function handleSubmit(){
  var contact = val('siteContact');
  var company = val('companyName');
  var checker = val('checkerName');
  var machine = val('machineName');
  var model = val('systemModel');

  if (!validateRequiredFields()) return;

  var payload = {
    basicInfo: {
      '廠區聯絡人': contact,
      '公司/工廠名稱': company,
      '檢核表填寫人': checker,
      '機台型號': machine,
      '系統型號': model
    },
    records: [buildRecord()]
  };

  var btn = document.getElementById('submitBtn');
  var status = document.getElementById('submitStatus');
  btn.disabled = true;
  status.textContent = '送出中…';

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script 特性：無法讀取實際回應內容或狀態碼
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    status.textContent = '';
    showCompletion({
      company: company,
      checker: checker,
      machine: machine,
      model: model,
      target: selectedPhase,
      time: new Date().toLocaleString('zh-TW')
    });
  } catch (err){
    // no-cors 模式下無法得知伺服器實際狀態，只有連線本身失敗時才會進到這裡，
    // 因此訊息刻意保持中性，不假定是網路問題或其他特定原因。
    console.error(err);
    status.textContent = '';
    showErrorModal('目前無法送出資料，請稍後再試一次。');
  } finally {
    btn.disabled = false;
  }
}

/* ============================================================
 * 完成頁
 * ============================================================ */
function showCompletion(info){
  var summary = document.getElementById('completionSummary');
  summary.innerHTML =
    '公司/工廠名稱：<b>' + info.company + '</b><br>' +
    '檢核表填寫人：<b>' + info.checker + '</b><br>' +
    '機台型號：<b>' + info.machine + '</b><br>' +
    '系統型號：<b>' + info.model + '</b><br>' +
    '使用目標：<b>' + info.target + '</b><br>' +
    '送出時間：<b>' + info.time + '</b>';
  document.getElementById('formView').style.display = 'none';
  document.getElementById('completionView').classList.add('visible');
}

function startNextChecklist(){
  handleClear();
  document.getElementById('completionView').classList.remove('visible');
  document.getElementById('formView').style.display = '';
}

/* ============================================================
 * 清除 / 重置
 * ============================================================ */
function handleClear(){
  ['companyName','siteContact','machineName','systemModel','checkerName'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  document.getElementById('submitStatus').textContent = '';
  REQUIRED_FIELDS.forEach(function(field){
    clearFieldError(field.id, field.errorId);
  });
  checkState = {};
  selectedPhase = null;
  selectedItem = null;
  renderUseTargetOptions();
  render();
}

/* ============================================================
 * 初始化
 * ============================================================ */
renderUseTargetOptions();
render();
</script>
</body>
</html>
