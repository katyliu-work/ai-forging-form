<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>導入檢核</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#F0F1F3;
    --surface-card:#FFFFFF;
    --surface-card-alt:#EAF0F5;
    --header-bg:#E7E9EC;
    --text-primary:#16181D;
    --text-secondary:#5B616B;
    --text-muted:#8F8C82;
    --accent:#2E5C8A;
    --border:#DCDFE3;
    --status-ok:#D6DCE1;
    --status-warn:#8AA6BE;
    --status-danger:#2E5C8A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'IBM Plex Sans TC','Inter',sans-serif;
    background:#DEE0E3;
    display:flex; justify-content:center; padding:32px 16px;
  }
  /* DESIGN: 結構 C（左右分區）＋ 風格 4（精確灰藍配色 ＋ 工業安全質感：分層陰影／統一大圓角／輕觸回饋） */
  .frame{
    width:680px; min-height:600px;
    background:var(--bg-page);
    border-radius:20px; border:1px solid #C9C6BD;
    padding:24px 26px; box-sizing:border-box;
    display:flex; flex-direction:column;
  }
  .header{ font-size:18px; font-weight:700; color:var(--text-primary); margin-bottom:4px; }
  .subheader{ font-size:13px; color:var(--text-muted); margin-bottom:18px; }

  .c-wrap{ display:flex; gap:14px; flex:1; }
  .c-nav{ width:170px; display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .c-nav-item{ display:flex; align-items:center; gap:9px; padding:12px 11px; border-radius:12px; font-size:14px; color:var(--text-secondary); cursor:pointer; user-select:none; }
  .c-nav-item.active{ background:var(--surface-card-alt); color:var(--accent); font-weight:700; }
  .c-nav-item.disabled{ opacity:0.4; cursor:default; }
  .c-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .c-dot.ok{ background:var(--status-ok); }
  .c-dot.warn{ background:var(--status-warn); }
  .c-dot.danger{ background:var(--status-danger); }

  .c-detail{
    flex:1; background:var(--surface-card); border-radius:12px; padding:16px 18px;
    box-shadow:0 2px 4px rgba(22,24,29,0.14), 0 4px 10px rgba(22,24,29,0.08);
  }
  .c-detail-title{ font-size:15px; font-weight:700; color:var(--accent); margin-bottom:10px; }

  .item-tabs{ display:flex; gap:7px; margin:6px 0 10px; }
  .item-tab{ padding:7px 15px; border-radius:12px; background:var(--header-bg); font-size:13px; color:var(--text-secondary); cursor:pointer; user-select:none; }
  .item-tab.active{ background:var(--accent); color:#FFFFFF; font-weight:600; }

  .b-step-label{ font-size:14px; font-weight:600; color:var(--text-primary); margin:12px 0 6px; }
  .b-step-group{ margin-bottom:10px; padding-left:10px; border-left:2px solid var(--border); }
  .b-step-title{ font-size:12px; color:var(--text-muted); margin-bottom:6px; }

  .b-item{ display:flex; align-items:center; gap:10px; padding:8px 0; font-size:14px; color:var(--text-secondary); cursor:pointer; user-select:none; }
  .b-check{ width:19px; height:19px; border:1.5px solid #B9BEC4; border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:opacity 0.15s; }
  .b-check.done{ background:var(--accent); border-color:var(--accent); }
  .b-check.done::after{ content:'✓'; color:#FFFFFF; font-size:13px; font-weight:700; line-height:1; }
  .b-item:active .b-check{ opacity:0.7; }

  .c-log{ margin-top:12px; font-size:11px; color:var(--text-muted); }

  @media (max-width:720px){
    .frame{ width:100%; }
    .c-wrap{ flex-direction:column; }
    .c-nav{ width:100%; flex-direction:row; flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="header">導入檢核</div>
  <div class="subheader">選擇測試階段</div>
  <div class="c-wrap">
    <div class="c-nav" id="nav"></div>
    <div class="c-detail" id="detail"></div>
  </div>
</div>

<script>
/* DESIGN: 測試階段（tier 1） -> 測試項目（tier 2） -> step1/step2 勾選項（tier 3） */
var phases = {
  '入料分段': { disabled:true },
  '打頭':     { disabled:true },
  '戳牙':     { disabled:false, items:['牙板壓力測試','波形偵測'] },
  '品管':     { disabled:false, items:['偵測出品質異常螺絲'] },
  '機台資料': { disabled:true }
};
var order = ['入料分段','打頭','戳牙','品管','機台資料'];
var step1Items = ['現場機台警示燈','系統介面顯示','現場機台停機'];
var step2Items = ['快速發現異常警示','可排除錯誤','機台警示與系統介面顯示恢復正常值'];

var selectedPhase = '戳牙';
var selectedItem = '牙板壓力測試';

function checklistHtml(){
  var h = '<div class="b-step-group"><div class="b-step-title">step1・可偵測並顯示異常值</div>';
  step1Items.forEach(function(t){
    h += '<div class="b-item" onclick="toggleCheck(this)"><div class="b-check done"></div>' + t + '</div>';
  });
  h += '</div><div class="b-step-group"><div class="b-step-title">step2・現場操作員執行</div>';
  step2Items.forEach(function(t){
    h += '<div class="b-item" onclick="toggleCheck(this)"><div class="b-check"></div>' + t + '</div>';
  });
  h += '</div>';
  return h;
}

function toggleCheck(el){
  el.querySelector('.b-check').classList.toggle('done');
}

function selectPhase(name){
  if (phases[name].disabled) return;
  selectedPhase = name;
  var items = phases[name].items;
  selectedItem = items[0];
  render();
}

function selectItem(name){
  selectedItem = name;
  render();
}

function renderNav(){
  var h = '';
  order.forEach(function(name){
    var p = phases[name];
    var dotClass = p.disabled ? 'ok' : 'warn';
    var cls = p.disabled ? 'disabled' : (name === selectedPhase ? 'active' : '');
    h += '<div class="c-nav-item ' + cls + '" onclick="selectPhase(\'' + name + '\')"><span class="c-dot ' + dotClass + '"></span>' + name + '</div>';
  });
  document.getElementById('nav').innerHTML = h;
}

function renderDetail(){
  var p = phases[selectedPhase];
  var h = '<div class="c-detail-title">' + selectedPhase + '・測試項目</div>';
  if (p.items.length > 1){
    h += '<div class="item-tabs">';
    p.items.forEach(function(it){
      h += '<div class="item-tab ' + (it === selectedItem ? 'active' : '') + '" onclick="selectItem(\'' + it + '\')">' + it + '</div>';
    });
    h += '</div>';
  }
  h += '<div class="b-step-label">' + selectedItem + '</div>';
  h += checklistHtml();
  h += '<div class="c-log">最後更新 14:30・王工程師</div>';
  document.getElementById('detail').innerHTML = h;
}

function render(){
  renderNav();
  renderDetail();
}
render();
</script>
</body>
</html>
